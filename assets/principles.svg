<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1424"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.4"/>
    </linearGradient>
  </defs>

  <rect width="900" height="200" rx="10" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1"/>

  <!-- 6 principle cards, 3x2 grid -->

  <!-- Card 1 -->
  <rect x="18" y="18" width="270" height="76" rx="8" fill="#1e2a44" stroke="#2dd4bf" stroke-width="1" opacity="0.85"/>
  <text x="38" y="44" font-family="'Courier New', monospace" font-size="18" fill="#2dd4bf">🧠</text>
  <text x="62" y="44" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#c9d1d9">Build Practical AI Systems</text>
  <text x="38" y="64" font-family="'Courier New', monospace" font-size="10.5" fill="#c9d1d9" opacity="0.65">Real-world utility over academic novelty.</text>
  <text x="38" y="80" font-family="'Courier New', monospace" font-size="10.5" fill="#c9d1d9" opacity="0.65">Solve problems that actually matter.</text>

  <!-- Card 2 -->
  <rect x="314" y="18" width="270" height="76" rx="8" fill="#1e2a44" stroke="#8b5cf6" stroke-width="1" opacity="0.85"/>
  <text x="334" y="44" font-family="'Courier New', monospace" font-size="18" fill="#8b5cf6">🏗️</text>
  <text x="358" y="44" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#c9d1d9">Develop Scalable Software</text>
  <text x="334" y="64" font-family="'Courier New', monospace" font-size="10.5" fill="#c9d1d9" opacity="0.65">Architecture that grows with the product.</text>
  <text x="334" y="80" font-family="'Courier New', monospace" font-size="10.5" fill="#c9d1d9" opacity="0.65">Design for tomorrow, build for today.</text>

  <!-- Card 3 -->
  <rect x="612" y="18" width="270" height="76" rx="8" fill="#1e2a44" stroke="#ec4899" stroke-width="1" opacity="0.85"/>
  <text x="632" y="44" font-family="'Courier New', monospace" font-size="18" fill="#ec4899">✨</text>
  <text x="656" y="44" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#c9d1d9">Focus on Clean Architecture</text>
  <text x="632" y="64" font-family="'Courier New', monospace" font-size="10.5" fill="#c9d1d9" opacity="0.65">Readable, maintainable, elegant code.</text>
  <text x="632" y="80" font-family="'Courier New', monospace" font-size="10.5" fill="#c9d1d9" opacity="0.65">Code is communication with the future.</text>

  <!-- Card 4 -->
  <rect x="18" y="110" width="270" height="76" rx="8" fill="#1e2a44" stroke="#2dd4bf" stroke-width="1" opacity="0.85"/>
  <text x="38" y="136" font-family="'Courier New', monospace" font-size="18" fill="#2dd4bf">🔒</text>
  <text x="62" y="136" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#c9d1d9">Prioritize Security &amp; Reliability</text>
  <text x="38" y="156" font-family="'Courier New', monospace" font-size="10.5" fill="#c9d1d9" opacity="0.65">Security is not a feature. It is a foundation.</text>
  <text x="38" y="172" font-family="'Courier New', monospace" font-size="10.5" fill="#c9d1d9" opacity="0.65">Build systems users can trust.</text>

  <!-- Card 5 -->
  <rect x="314" y="110" width="270" height="76" rx="8" fill="#1e2a44" stroke="#8b5cf6" stroke-width="1" opacity="0.85"/>
  <text x="334" y="136" font-family="'Courier New', monospace" font-size="18" fill="#8b5cf6">🔬</text>
  <text x="358" y="136" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#c9d1d9">Keep Learning &amp; Experimenting</text>
  <text x="334" y="156" font-family="'Courier New', monospace" font-size="10.5" fill="#c9d1d9" opacity="0.65">Curiosity is the engine of innovation.</text>
  <text x="334" y="172" font-family="'Courier New', monospace" font-size="10.5" fill="#c9d1d9" opacity="0.65">Stay a student, always.</text>

  <!-- Card 6 -->
  <rect x="612" y="110" width="270" height="76" rx="8" fill="#1e2a44" stroke="#ec4899" stroke-width="1" opacity="0.85"/>
  <text x="632" y="136" font-family="'Courier New', monospace" font-size="18" fill="#ec4899">🚀</text>
  <text x="656" y="136" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#c9d1d9">Convert Ideas into Products</text>
  <text x="632" y="156" font-family="'Courier New', monospace" font-size="10.5" fill="#c9d1d9" opacity="0.65">Ship early, iterate fast, improve always.</text>
  <text x="632" y="172" font-family="'Courier New', monospace" font-size="10.5" fill="#c9d1d9" opacity="0.65">Ideas are worthless without execution.</text>
</svg>
