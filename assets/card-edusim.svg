<svg width="430" height="220" viewBox="0 0 430 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1424"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#0d1424;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="430" height="220" rx="12" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <!-- Top header accent -->
  <rect x="0" y="0" width="430" height="55" rx="12" fill="url(#headerGrad)"/>
  <rect x="0" y="42" width="430" height="13" fill="url(#headerGrad)"/>
  <!-- Top border accent line -->
  <rect x="0" y="0" width="430" height="3" rx="2" fill="#2dd4bf" opacity="0.8"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="3" height="220" rx="2" fill="#2dd4bf" opacity="0.6"/>

  <!-- Project icon -->
  <circle cx="30" cy="30" r="16" fill="#1e2a44" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="30" y="35" font-family="monospace" font-size="14" text-anchor="middle" fill="#2dd4bf">📚</text>

  <!-- Project name -->
  <text x="56" y="24" font-family="'Courier New', Consolas, monospace" font-size="18" font-weight="800"
        fill="#2dd4bf" letter-spacing="1">EduSim</text>
  <text x="56" y="40" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#c9d1d9" opacity="0.6"
        letter-spacing="1">AI-POWERED EDUCATIONAL PLATFORM</text>

  <!-- Divider -->
  <line x1="18" y1="58" x2="412" y2="58" stroke="#1e2a44" stroke-width="1"/>

  <!-- Description -->
  <text x="18" y="80" font-family="'Courier New', Consolas, monospace" font-size="11.5" fill="#c9d1d9" opacity="0.88">
    Multilingual voice-interactive educational platform
  </text>
  <text x="18" y="97" font-family="'Courier New', Consolas, monospace" font-size="11.5" fill="#c9d1d9" opacity="0.88">
    with personalized learning, RAG-based textbook
  </text>
  <text x="18" y="114" font-family="'Courier New', Consolas, monospace" font-size="11.5" fill="#c9d1d9" opacity="0.88">
    retrieval, AI tutoring &amp; interactive simulations.
  </text>

  <!-- Tech stack label -->
  <text x="18" y="140" font-family="'Courier New', Consolas, monospace" font-size="9.5" fill="#2dd4bf" opacity="0.7"
        letter-spacing="2">STACK</text>
  <line x1="64" y1="135" x2="412" y2="135" stroke="#1e2a44" stroke-width="1"/>

  <!-- Tech badges -->
  <rect x="18" y="148" width="58" height="18" rx="9" fill="#1e2a44" stroke="#2dd4bf" stroke-width="0.8"/>
  <text x="47" y="161" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" fill="#2dd4bf">Python</text>

  <rect x="84" y="148" width="66" height="18" rx="9" fill="#1e2a44" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="117" y="161" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" fill="#8b5cf6">RAG / LLM</text>

  <rect x="158" y="148" width="56" height="18" rx="9" fill="#1e2a44" stroke="#ec4899" stroke-width="0.8"/>
  <text x="186" y="161" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" fill="#ec4899">FastAPI</text>

  <rect x="222" y="148" width="50" height="18" rx="9" fill="#1e2a44" stroke="#2dd4bf" stroke-width="0.8"/>
  <text x="247" y="161" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" fill="#2dd4bf">React</text>

  <rect x="280" y="148" width="60" height="18" rx="9" fill="#1e2a44" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="310" y="161" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" fill="#8b5cf6">NLP/ML</text>

  <!-- GitHub link button -->
  <rect x="18" y="185" width="140" height="26" rx="13" fill="#1e2a44" stroke="#2dd4bf" stroke-width="1.2"/>
  <text x="88" y="202" font-family="'Courier New', monospace" font-size="11" font-weight="600"
        text-anchor="middle" fill="#2dd4bf">⬡ View Repository</text>

  <!-- Status badge -->
  <rect x="342" y="188" width="70" height="20" rx="10" fill="#2dd4bf" opacity="0.15" stroke="#2dd4bf" stroke-width="0.8"/>
  <circle cx="354" cy="198" r="3" fill="#2dd4bf"/>
  <text x="370" y="202" font-family="'Courier New', monospace" font-size="9" fill="#2dd4bf">Active</text>
</svg>
