  <!-- Pulsing outer ring -->
  <circle cx="80" cy="230" r="14" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>
  <rect x="105" y="218" width="80" height="24" rx="12" fill="#1e2a44" stroke="#2dd4bf" stroke-width="1" opacity="0.9"/>
