        text-anchor="middle" fill="#2dd4bf">2023</text>
  <text x="185" y="46" font-family="'Courier New', monospace" font-size="13" font-weight="600" fill="#c9d1d9">Started AI &amp; Data Science Undergraduate</text>
  <text x="185" y="63" font-family="'Courier New', monospace" font-size="11" fill="#c9d1d9" opacity="0.65">Stanley College of Engineering, Hyderabad · Built foundational CS skills</text>

  <!-- Event 2: 2024 -->
  <circle cx="80" cy="110" r="10" fill="#0d1424" stroke="#8b5cf6" stroke-width="2.5"/>
