  <text x="200" y="226" font-family="'Courier New', monospace" font-size="13" font-weight="600" fill="#c9d1d9">Advanced AI Systems &amp; Graduation Milestone</text>
  <text x="200" y="243" font-family="'Courier New', monospace" font-size="11" fill="#2dd4bf" opacity="0.8">[ IN PROGRESS ] Expanding skills · Building production-ready AI products</text>
