        text-anchor="middle" fill="#ec4899">2025–2026</text>
  <text x="200" y="166" font-family="'Courier New', monospace" font-size="13" font-weight="600" fill="#c9d1d9">Built AI &amp; Data Science Projects</text>
  <text x="200" y="183" font-family="'Courier New', monospace" font-size="11" fill="#c9d1d9" opacity="0.65">EduSim · InsightFlow · TrustShare · Smart Grid AI · AI Research</text>

