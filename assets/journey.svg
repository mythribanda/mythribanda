<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1424"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="timelineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.8"/>
      <stop offset="33%" style="stop-color:#8b5cf6;stop-opacity:0.8"/>
      <stop offset="66%" style="stop-color:#ec4899;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.4"/>
    </linearGradient>
  </defs>

  <rect width="900" height="280" rx="10" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1"/>

  <!-- Timeline vertical line -->
  <line x1="80" y1="30" x2="80" y2="250" stroke="url(#timelineGrad)" stroke-width="2.5"/>

  <!-- Event 1: 2023 -->
  <circle cx="80" cy="50" r="10" fill="#0d1424" stroke="#2dd4bf" stroke-width="2.5"/>
