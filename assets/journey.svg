  <text x="185" y="123" font-family="'Courier New', monospace" font-size="11" fill="#c9d1d9" opacity="0.65">Explored Python, React, FastAPI · Started building real-world projects</text>

  <!-- Event 3: 2025–2026 -->
  <circle cx="80" cy="170" r="10" fill="#0d1424" stroke="#ec4899" stroke-width="2.5"/>
  <circle cx="80" cy="170" r="4" fill="#ec4899"/>
  <rect x="105" y="158" width="80" height="24" rx="12" fill="#1e2a44" stroke="#ec4899" stroke-width="1" opacity="0.9"/>
